[versions]
gson = "2.14.0"
gradleDownloadTask = "5.7.0"
diffpatch = "2.1.0.43"
gradleutils = "6.0.0"
foojay = "1.0.0"
moddev = "2.0.142"
mergetool = "2.0.7"
jsr305 = "3.0.2"
annotations = "26.1.0"
javaObjcBridge = "1.2"
installertools = "4.0.17"
vineflower = "1.12.0"
vineflowerPlugins = "0.1.6"
ecj = "3.46.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
gradleDownloadTask = { module = "de.undercouch:gradle-download-task", version.ref = "gradleDownloadTask" }
diffpatch = { module = "io.codechicken:DiffPatch", version.ref = "diffpatch" }
gradleutils = { module = "net.neoforged.gradleutils:net.neoforged.gradleutils.gradle.plugin", version.ref = "gradleutils" }
foojay = { module = "org.gradle.toolchains.foojay-resolver-convention:org.gradle.toolchains.foojay-resolver-convention.gradle.plugin", version.ref = "foojay" }
moddev = { module = "net.neoforged.moddev:net.neoforged.moddev.gradle.plugin", version.ref = "moddev" }
mergetool = { module = "net.neoforged:mergetool", version.ref = "mergetool" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
javaObjcBridge = { module = "ca.weblite:java-objc-bridge", version.ref = "javaObjcBridge" }
installertools = { module = "net.neoforged.installertools:installertools", version.ref = "installertools" }
vineflower = { module = "org.vineflower:vineflower", version.ref = "vineflower" }
vineflowerPlugins = { module = "net.neoforged:vineflower-plugins", version.ref = "vineflowerPlugins" }
ecj = { module = "org.eclipse.jdt:ecj", version.ref = "ecj" }
