name: Build and Test

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: neoforged/actions/checkout@main

      - name: Setup JDK 25
        uses: neoforged/actions/setup-java@main
        with:
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR builds: read-only cache (don't pollute); main push: read-write (seed the cache)
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Test
        run: ./gradlew :check

      - name: Publish PR artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: neoforged/action-pr-publishing/upload@v1
